[versions]
agp = "9.2.1"
kotlin = "2.3.20"

android-sdk-compile = "37"
android-sdk-target = "37"
android-sdk-min = "24"

firebaseCrashlytics = "19.4.4"
firebaseCrashlyticsGradle = "3.0.4"

gms = "4.4.4"

coroutines = "1.11.0"
ksp-plugin = "2.3.6"

hilt = "2.59.2"
navigation = "2.9.8"
room = "2.8.4"
lifecycle = "2.10.0"
camera = "1.6.1"

okhttp = "5.3.2"
retrofit = "3.0.0"
moshi = "1.15.2"
