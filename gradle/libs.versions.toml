androidx-localBroadcastManager = "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
androidx-recyclerview = "androidx.recyclerview:recyclerview:1.4.0"
androidx-splashscreen = "androidx.core:core-splashscreen:1.2.0"
androidx-savedstate = "androidx.savedstate:savedstate-ktx:1.4.0"
androidx-testing-core = "androidx.test:core-ktx:1.7.0"
