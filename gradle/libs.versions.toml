google-play-services-base = "com.google.android.gms:play-services-base:18.10.0"
google-mlkit-common = "com.google.mlkit:common:18.11.0"
google-firebase-messaging = "com.google.firebase:firebase-messaging:25.0.2"

okhttp-okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

retrofit-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
